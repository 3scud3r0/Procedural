name: Validate Procedural
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . ruff==0.12.12
      - run: python -m unittest discover -s tests -v
      - run: ruff check procedural_lab tests scripts examples/custom_generator.py
      - run: ruff format --check procedural_lab tests scripts examples/custom_generator.py
      - run: procedural run examples/city/main.proc --output /tmp/procedural-example
      - run: procedural verify /tmp/procedural-example
      - run: python scripts/validate_backends.py /tmp/backend-report.json
